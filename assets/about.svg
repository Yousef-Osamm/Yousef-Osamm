    <g class="mono" font-size="15.5" >
      <text x="76" y="94" class="l" style="animation-delay:.2s"><tspan class="k">class</tspan> <tspan class="t">YousefOsama</tspan><tspan class="p">(</tspan><tspan class="t">Developer</tspan><tspan class="p">):</tspan></text>
      <text x="113" y="122" class="l" style="animation-delay:.5s"><tspan class="c">"""Full-stack developer in the making — React × Django."""</tspan></text>
      <text x="113" y="178" class="l" style="animation-delay:.8s"><tspan class="v">focus</tspan><tspan class="p" x="198">=</tspan> <tspan class="p">(</tspan><tspan class="s">"React"</tspan><tspan class="p">,</tspan> <tspan class="s">"Django"</tspan><tspan class="p">)</tspan></text>
      <text x="113" y="206" class="l" style="animation-delay:1.1s"><tspan class="v">unlocked</tspan><tspan class="p" x="198">=</tspan> <tspan class="p">[</tspan><tspan class="s">"HTML"</tspan><tspan class="p">,</tspan> <tspan class="s">"CSS"</tspan><tspan class="p">,</tspan> <tspan class="s">"JavaScript"</tspan><tspan class="p">,</tspan> <tspan class="s">"Responsive UI"</tspan><tspan class="p">]</tspan></text>
      <text x="113" y="234" class="l" style="animation-delay:1.4s"><tspan class="v">learning</tspan><tspan class="p" x="198">=</tspan> <tspan class="p">[</tspan><tspan class="s">"React"</tspan><tspan class="p">,</tspan> <tspan class="s">"Python"</tspan><tspan class="p">,</tspan> <tspan class="s">"Django REST Framework"</tspan><tspan class="p">]</tspan></text>
      <text x="113" y="262" class="l" style="animation-delay:1.7s"><tspan class="v">can_ship</tspan><tspan class="p" x="198">=</tspan> <tspan class="s">"clean, responsive frontend projects"</tspan></text>
      <text x="113" y="318" class="l" style="animation-delay:2s"><tspan class="k">def</tspan> <tspan class="f">daily_loop</tspan><tspan class="p">(</tspan><tspan class="n">self</tspan><tspan class="p">):</tspan></text>
      <text x="150" y="346" class="l" style="animation-delay:2.3s"><tspan class="k">while</tspan> <tspan class="n">True</tspan><tspan class="p">:</tspan></text>
      <text x="187" y="374" class="l" style="animation-delay:2.6s"><tspan class="n">self</tspan><tspan class="p">.</tspan><tspan class="f">learn</tspan><tspan class="p">();</tspan> <tspan class="n">self</tspan><tspan class="p">.</tspan><tspan class="f">build</tspan><tspan class="p">();</tspan> <tspan class="n">self</tspan><tspan class="p">.</tspan><tspan class="f">ship</tspan><tspan class="p">()</tspan>   <tspan class="c"># repeat</tspan></text>
      <text x="76" y="430" class="l" style="animation-delay:3.2s"><tspan fill="#44B78B">&gt;&gt;&gt;</tspan> <tspan class="t">YousefOsama</tspan><tspan class="p">().</tspan><tspan class="f">status</tspan><tspan class="p">()</tspan></text>
      <text x="76" y="458" class="l" style="animation-delay:4s"><tspan class="s">'frontend: ready ✓   |   backend: compiling...'</tspan></text>
      <text x="76" y="486" class="l" style="animation-delay:4.6s"><tspan fill="#44B78B">&gt;&gt;&gt;</tspan></text>
    </g>
