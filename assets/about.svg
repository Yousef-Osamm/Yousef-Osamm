<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">about_me.py</title>
  <desc id="desc">A Python class describing Yousef: focus React and Django; unlocked HTML, CSS, JavaScript and responsive UI; learning React, Python and Django REST Framework; status: frontend ready, backend compiling.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .l{opacity:0;animation:in .45s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .hl{opacity:0;animation:hl 7s ease-in-out 5.6s infinite}
    @keyframes hl{0%,100%{opacity:0}10%,40%{opacity:1}55%{opacity:0}}
    .k{fill:#C792EA}.f{fill:#82AAFF}.s{fill:#C3E88D}.c{fill:#546E7A;font-style:italic}.p{fill:#89DDFF}.v{fill:#E6EDF7}.n{fill:#F78C6C}.t{fill:#FFCB6B}.d{fill:#8FA3C7}
  </style>
  <defs>
