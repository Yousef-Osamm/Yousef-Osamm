<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Learning roadmap to full-stack</title>
  <desc id="desc">Web foundations done. React and Python in progress. Django and Django REST Framework next. Goal: full-stack React and Django developer.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Inter",Ubuntu,"Helvetica Neue",Arial,sans-serif}
    .flow{animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-20}}
    .draw{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 2.2s cubic-bezier(.4,0,.2,1) .4s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
    .bob{animation:bob 2.2s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
    .fade{opacity:0;animation:fade .8s ease forwards}
    @keyframes fade{to{opacity:1}}
    .star{transform-box:fill-box;transform-origin:center;animation:star 3s ease-in-out infinite}
    @keyframes star{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(18deg) scale(1.12)}}
  </style>
  <defs>
    <linearGradient id="done" gradientUnits="userSpaceOnUse" x1="110" x2="410"><stop offset="0" stop-color="#44B78B"/><stop offset=".6" stop-color="#61DAFB"/><stop offset="1" stop-color="#FFD43B"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#61DAFB" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#44B78B" stop-opacity=".45"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#61DAFB" stop-opacity=".22"/><stop offset="1" stop-color="#61DAFB" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#9FB4D9" fill-opacity=".09"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1000" height="330" rx="22" fill="#070B14"/>
  <rect width="1000" height="330" rx="22" fill="url(#dots)"/>
  <circle cx="400" cy="175" r="200" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="999" height="329" rx="21.5" fill="none" stroke="url(#edge)"/>

  <text x="40" y="48" class="mono" font-size="13" fill="#4F5D7A">// roadmap.config.js</text>
  <text x="40" y="78" class="sans" font-size="24" font-weight="700" fill="#E6EDF7">The path to <tspan fill="#61DAFB">React</tspan> <tspan fill="#6B7A99">×</tspan> <tspan fill="#44B78B">Django</tspan></text>
  <g class="mono" font-size="12" fill="#6B7A99" text-anchor="end">
    <circle cx="756" cy="66" r="5" fill="#44B78B"/><text x="802" y="70">done</text>
    <circle cx="828" cy="66" r="5" fill="#FFD43B"/><text x="890" y="70">active</text>
    <circle cx="914" cy="66" r="5" fill="none" stroke="#6B7A99" stroke-width="1.5"/><text x="960" y="70">next</text>
  </g>

  <!-- track -->
  <line x1="110" y1="175" x2="890" y2="175" stroke="#22304A" stroke-width="3" stroke-dasharray="6 14" stroke-linecap="round" class="flow"/>
  <line x1="110" y1="175" x2="410" y2="175" stroke="url(#done)" stroke-width="4" stroke-linecap="round" class="draw" filter="url(#glow)"/>

  <!-- 1 · foundations (done) -->
  <g class="pop" style="animation-delay:.3s">
    <circle cx="110" cy="175" r="27" fill="#0C1A17" stroke="#44B78B" stroke-width="2.5"/>
    <path d="M98 176l8 8 16-17" fill="none" stroke="#44B78B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 2 · react (active) -->
  <g class="pop" style="animation-delay:1s">
    <circle cx="305" cy="175" r="36" fill="none" stroke="#61DAFB" stroke-opacity=".7" stroke-width="2" stroke-dasharray="4 7" class="spin"/>
    <circle cx="305" cy="175" r="27" fill="#0A1824" stroke="#61DAFB" stroke-width="2.5"/>
    <g transform="translate(305 175)" fill="none" stroke="#61DAFB" stroke-width="1.6">
      <ellipse rx="15" ry="5.5"/><ellipse rx="15" ry="5.5" transform="rotate(60)"/><ellipse rx="15" ry="5.5" transform="rotate(120)"/>
      <circle r="2.6" fill="#61DAFB" stroke="none"/>
    </g>
  </g>
  <!-- 3 · python (active) -->
  <g class="pop" style="animation-delay:1.7s">
    <circle cx="500" cy="175" r="36" fill="none" stroke="#FFD43B" stroke-opacity=".7" stroke-width="2" stroke-dasharray="4 7" class="spin" style="animation-direction:reverse"/>
    <circle cx="500" cy="175" r="27" fill="#1A1708" stroke="#FFD43B" stroke-width="2.5"/>
    <text x="500" y="181" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#FFD43B">py</text>
  </g>
  <!-- 4 · django (next) -->
  <g class="pop" style="animation-delay:2.2s">
    <circle cx="695" cy="175" r="27" fill="#0B111C" stroke="#3A4A66" stroke-width="2" stroke-dasharray="3 4"/>
    <text x="695" y="181" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#6F8CA8">dj</text>
  </g>
  <!-- 5 · goal -->
  <g class="pop" style="animation-delay:2.6s">
    <circle cx="890" cy="175" r="27" fill="#0B111C" stroke="#3A4A66" stroke-width="2"/>
    <path class="star" d="M890 160l4.4 9 9.9 1.4-7.2 7 1.7 9.8-8.8-4.6-8.8 4.6 1.7-9.8-7.2-7 9.9-1.4z" fill="none" stroke="#E6EDF7" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- you are here -->
  <g class="fade" style="animation-delay:2.4s">
    <circle cx="410" cy="175" r="7" fill="#FFD43B" class="ping"/>
    <circle cx="410" cy="175" r="7" fill="#FFD43B" stroke="#070B14" stroke-width="3"/>
    <g class="bob">
      <rect x="356" y="104" width="108" height="26" rx="13" fill="#FFD43B"/>
      <path d="M404 130l6 7 6-7z" fill="#FFD43B"/>
      <text x="410" y="121.5" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#1A1708">YOU ARE HERE</text>
    </g>
  </g>

  <!-- labels -->
  <g class="fade sans" style="animation-delay:.6s" text-anchor="middle">
    <text x="110" y="238" font-size="16" font-weight="700" fill="#E6EDF7">Foundations</text>
    <text x="110" y="260" class="mono" font-size="11.5" fill="#44B78B" letter-spacing="1">UNLOCKED</text>
    <text x="110" y="282" class="mono" font-size="12" fill="#6B7A99">HTML · CSS · JS</text>
  </g>
  <g class="fade sans" style="animation-delay:1.2s" text-anchor="middle">
    <text x="305" y="238" font-size="16" font-weight="700" fill="#E6EDF7">React</text>
    <text x="305" y="260" class="mono" font-size="11.5" fill="#61DAFB" letter-spacing="1">LEVELING UP</text>
    <text x="305" y="282" class="mono" font-size="12" fill="#6B7A99">components · hooks</text>
  </g>
  <g class="fade sans" style="animation-delay:1.9s" text-anchor="middle">
    <text x="500" y="238" font-size="16" font-weight="700" fill="#E6EDF7">Python</text>
    <text x="500" y="260" class="mono" font-size="11.5" fill="#FFD43B" letter-spacing="1">LEVELING UP</text>
    <text x="500" y="282" class="mono" font-size="12" fill="#6B7A99">syntax · OOP · logic</text>
  </g>
  <g class="fade sans" style="animation-delay:2.3s" text-anchor="middle">
    <text x="695" y="238" font-size="16" font-weight="700" fill="#9AABC4">Django + DRF</text>
    <text x="695" y="260" class="mono" font-size="11.5" fill="#6F8CA8" letter-spacing="1">UP NEXT</text>
    <text x="695" y="282" class="mono" font-size="12" fill="#4F5D7A">models · APIs · auth</text>
  </g>
  <g class="fade sans" style="animation-delay:2.7s" text-anchor="middle">
    <text x="890" y="238" font-size="16" font-weight="700" fill="#9AABC4">Full-Stack</text>
    <text x="890" y="260" class="mono" font-size="11.5" fill="#6F8CA8" letter-spacing="1">DESTINATION</text>
    <text x="890" y="282" class="mono" font-size="12" fill="#4F5D7A">React × Django apps</text>
  </g>
</svg>
