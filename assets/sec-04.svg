<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="78" viewBox="0 0 1000 78" role="img" aria-label="04 — roadmap: where I am · where I'm going">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Inter",Ubuntu,"Helvetica Neue",Arial,sans-serif}

    .in{opacity:0;animation:in .8s cubic-bezier(.2,.8,.2,1) .1s forwards}
    @keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#61DAFB" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#44B78B" stop-opacity=".55"/></linearGradient>
    <linearGradient id="num" x1="0" x2="1"><stop offset="0" stop-color="#61DAFB"/><stop offset="1" stop-color="#44B78B"/></linearGradient>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#61DAFB" stop-opacity="0"/><stop offset=".5" stop-color="#61DAFB" stop-opacity=".9"/><stop offset="1" stop-color="#44B78B" stop-opacity="0"/></linearGradient>
    <linearGradient id="glowL" x1="0" x2="1"><stop offset="0" stop-color="#61DAFB" stop-opacity=".12"/><stop offset=".5" stop-color="#61DAFB" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="1000" height="78" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="78" fill="#070B14"/>
    <rect width="1000" height="78" fill="url(#glowL)"/>
    <rect x="-300" y="76" width="300" height="2" fill="url(#sweep)"><animate attributeName="x" values="-300;1000" dur="4s" begin="0.9s" repeatCount="indefinite"/></rect>
    <g class="in">
      <text x="28" y="55" class="sans" font-size="44" font-weight="900" fill="none" stroke="url(#num)" stroke-width="1.3">04</text>
      <rect x="100" y="20" width="1.5" height="38" fill="#1E2A3D"/>
      <text x="120" y="40" class="mono" font-size="21" font-weight="700" fill="#E6EDF7"><tspan fill="#44B78B">❯ </tspan>roadmap<tspan class="blink" fill="#61DAFB">_</tspan></text>
      <text x="120" y="60" class="mono" font-size="12" fill="#5E6E8E">// where I am · where I'm going</text>
    </g>
    <text x="972" y="44" class="mono" font-size="11" fill="#2E3B55" text-anchor="end" letter-spacing="2">SECTION 04 / 07</text>
  </g>
  <rect x=".5" y=".5" width="999" height="77" rx="15.5" fill="none" stroke="url(#edge)"/>
</svg>
