<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">System architecture — how I'll ship full-stack apps</title>
  <desc id="desc">Animated diagram. Frontend zone (online): Browser and React UI exchange data. Backend zone (under construction): REST API with Django REST Framework, Django, and PostgreSQL, with requests flowing slowly while they are being built.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Inter",Ubuntu,"Helvetica Neue",Arial,sans-serif}

    .pop{opacity:0;animation:pop .6s cubic-bezier(.3,1.5,.5,1) forwards}
    @keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .8s ease forwards}
    @keyframes fade{to{opacity:1}}
    .flow{animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    .blink{animation:blink 1.2s steps(1) infinite}
    @keyframes blink{50%{opacity:.2}}
    .dot{animation:dot 1.4s ease-in-out infinite}
    @keyframes dot{0%,100%{opacity:1}50%{opacity:.2}}
    .spin{transform-origin:300px 212px;animation:spin 10s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
    .hz{animation:hz 2s linear infinite}
    @keyframes hz{to{transform:translateX(24px)}}
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#61DAFB" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#44B78B" stop-opacity=".55"/></linearGradient>
    <pattern id="haz" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="24" fill="#FFD43B" fill-opacity=".035"/></pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#9FB4D9" fill-opacity=".07"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="cross" x1="370" x2="440" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#61DAFB"/><stop offset="1" stop-color="#FFD43B"/></linearGradient>
    <clipPath id="c"><rect width="1000" height="430" rx="22"/></clipPath>
    <clipPath id="bz"><rect x="410" y="118" width="570" height="236" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="430" fill="#070B14"/>
    <rect width="1000" height="430" fill="url(#dots)"/>

    <text x="40" y="48" class="mono" font-size="13" fill="#4F5D7A">// system.architecture.svg</text>
    <text x="40" y="80" class="sans" font-size="24" font-weight="700" fill="#E6EDF7">How I'll ship <tspan fill="#61DAFB">full-stack</tspan> apps</text>

    <!-- zones -->
    <rect x="20" y="118" width="380" height="236" rx="16" fill="#44B78B" fill-opacity=".035" stroke="#44B78B" stroke-opacity=".35"/>
    <g clip-path="url(#bz)"><g class="hz"><rect x="386" y="118" width="620" height="236" fill="url(#haz)"/></g></g>
    <rect x="410" y="118" width="570" height="236" rx="16" fill="none" stroke="#FFD43B" stroke-opacity=".45" stroke-dasharray="7 6" class="flow"/>
    <g class="mono" font-size="11.5" letter-spacing="1.5">
      <circle cx="40" cy="145" r="4.5" fill="#44B78B" class="dot"/>
      <text x="52" y="149" fill="#44B78B">FRONTEND · ONLINE</text>
      <circle cx="430" cy="145" r="4.5" fill="#FFD43B" class="blink"/>
      <text x="442" y="149" fill="#FFD43B">BACKEND · UNDER CONSTRUCTION</text>
      <text x="962" y="149" fill="#4F5D7A" text-anchor="end">ETA: one commit at a time</text>
    </g>

    <!-- wires -->
    <line x1="180" y1="236" x2="230" y2="236" stroke="#61DAFB" stroke-width="2"/>
    <line x1="370" y1="236" x2="440" y2="236" stroke="url(#cross)" stroke-width="2" stroke-dasharray="6 4" class="flow"/>
    <line x1="580" y1="236" x2="630" y2="236" stroke="#FFD43B" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 4" class="flow"/>
    <line x1="770" y1="236" x2="820" y2="236" stroke="#FFD43B" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 4" class="flow"/>

    <!-- cards -->
    <g class="pop" style="animation-delay:0.2s"><rect x="40.0" y="172" width="140" height="148" rx="14" fill="#0B1626" stroke="#61DAFB" stroke-opacity=".55"/></g><g class="pop" style="animation-delay:0.4s"><rect x="230.0" y="172" width="140" height="148" rx="14" fill="#0B1626" stroke="#61DAFB" stroke-opacity=".55"/></g><g class="pop" style="animation-delay:0.6s"><rect x="440.0" y="172" width="140" height="148" rx="14" fill="#0A0F1A" stroke="#3A4A66" stroke-dasharray="4 4"/></g><g class="pop" style="animation-delay:0.8s"><rect x="630.0" y="172" width="140" height="148" rx="14" fill="#0A0F1A" stroke="#3A4A66" stroke-dasharray="4 4"/></g><g class="pop" style="animation-delay:1.0s"><rect x="820.0" y="172" width="140" height="148" rx="14" fill="#0A0F1A" stroke="#3A4A66" stroke-dasharray="4 4"/></g>

    <!-- icons + labels -->
    <g class="fade" style="animation-delay:.4s">
      <rect x="80" y="192" width="60" height="42" rx="6" fill="none" stroke="#61DAFB" stroke-width="1.8"/>
      <line x1="80" y1="203" x2="140" y2="203" stroke="#61DAFB" stroke-width="1.5"/>
      <circle cx="87" cy="197.5" r="1.8" fill="#FF5F57"/><circle cx="93" cy="197.5" r="1.8" fill="#FEBC2E"/><circle cx="99" cy="197.5" r="1.8" fill="#28C840"/>
      <path d="M100 215l6 12 2-5 5-2z" fill="#E6EDF7"/>
      <text x="110" y="268" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#E6EDF7">Browser</text>
      <text x="110" y="287" text-anchor="middle" class="mono" font-size="11" fill="#6B7A99">the user</text>
    </g>
    <g class="fade" style="animation-delay:.6s">
      <g class="spin" fill="none" stroke="#61DAFB" stroke-width="1.8">
        <ellipse cx="300" cy="212" rx="30" ry="11"/><ellipse cx="300" cy="212" rx="30" ry="11" transform="rotate(60 300 212)"/><ellipse cx="300" cy="212" rx="30" ry="11" transform="rotate(120 300 212)"/>
      </g>
      <circle cx="300" cy="212" r="4.5" fill="#61DAFB"/>
      <text x="300" y="268" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#E6EDF7">React UI</text>
      <text x="300" y="287" text-anchor="middle" class="mono" font-size="11" fill="#44B78B">✓ shipping</text>
    </g>
    <g class="fade" style="animation-delay:.8s">
      <text x="510" y="224" text-anchor="middle" class="mono" font-size="30" font-weight="700" fill="#FFD43B" fill-opacity=".85">{ }</text>
      <text x="510" y="268" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#AEB9CC">REST API</text>
      <text x="510" y="287" text-anchor="middle" class="mono" font-size="11" fill="#6B7A99">DRF · JSON</text>
    </g>
    <g class="fade" style="animation-delay:1s">
      <rect x="680" y="192" width="40" height="40" rx="9" fill="#44B78B" fill-opacity=".14" stroke="#44B78B" stroke-opacity=".6"/>
      <text x="700" y="218" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#44B78B">dj</text>
      <text x="700" y="268" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#AEB9CC">Django</text>
      <text x="700" y="287" text-anchor="middle" class="mono" font-size="11" fill="#6B7A99">models · views</text>
    </g>
    <g class="fade" style="animation-delay:1.2s" fill="none" stroke="#7FA7D6" stroke-width="1.8">
      <ellipse cx="890" cy="196" rx="22" ry="7"/>
      <path d="M868 196v28c0 4 10 7 22 7s22-3 22-7v-28"/>
      <path d="M868 210c0 4 10 7 22 7s22-3 22-7" stroke-opacity=".6"/>
      <text x="890" y="268" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#AEB9CC" stroke="none">PostgreSQL</text>
      <text x="890" y="287" text-anchor="middle" class="mono" font-size="11" fill="#6B7A99" stroke="none">data layer</text>
    </g>

    <!-- build meters inside backend cards -->
    <g class="fade mono" style="animation-delay:1.4s" font-size="9.5" fill="#4F5D7A">
      <rect x="455" y="296" width="110" height="3" rx="1.5" fill="#1A2438" transform="translate(0 0)"/>
      <rect x="455" y="296" width="0" height="3" rx="1.5" fill="#FFD43B"><animate attributeName="width" values="0;22" dur="1.5s" begin="1.6s" fill="freeze"/></rect>
      <rect x="645" y="296" width="110" height="3" rx="1.5" fill="#1A2438"/>
      <rect x="645" y="296" width="0" height="3" rx="1.5" fill="#44B78B"><animate attributeName="width" values="0;17" dur="1.5s" begin="1.8s" fill="freeze"/></rect>
      <rect x="835" y="296" width="110" height="3" rx="1.5" fill="#1A2438"/>
      <rect x="835" y="296" width="0" height="3" rx="1.5" fill="#7FA7D6"><animate attributeName="width" values="0;6" dur="1.5s" begin="2s" fill="freeze"/></rect>
    </g>
    <g transform="translate(0 10)" class="fade mono" style="animation-delay:1.4s" font-size="9.5" fill="#4F5D7A" text-anchor="middle">
      <text x="510" y="304">building · 20%</text><text x="700" y="304">building · 15%</text><text x="890" y="304">queued · 5%</text>
    </g>

    <!-- packets: frontend (fast, solid) -->
    <circle r="4.5" fill="#61DAFB" filter="url(#glow)"><animateMotion dur="1.1s" repeatCount="indefinite" path="M180 230H230"/></circle>
    <circle r="4.5" fill="#44B78B" filter="url(#glow)"><animateMotion dur="1.1s" begin=".55s" repeatCount="indefinite" path="M230 242H180"/></circle>
    <!-- request crossing into backend -->
    <circle r="4.5" fill="#61DAFB" filter="url(#glow)" opacity="0">
      <animateMotion dur="3s" repeatCount="indefinite" path="M370 236H440" keyPoints="0;1;1" keyTimes="0;.4;1" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.4;.42;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="236" r="8" fill="none" stroke="#FFD43B" stroke-width="2" class="ping"/>
    <text x="405" y="222" text-anchor="middle" class="mono" font-size="10" fill="#6B7A99">GET /api</text>
    <text x="405" y="260" text-anchor="middle" class="mono blink" font-size="10" fill="#FFD43B">202 · soon</text>
    <!-- backend (slow, dim) -->
    <circle r="3.5" fill="#FFD43B" opacity=".7"><animateMotion dur="3.2s" repeatCount="indefinite" path="M580 236H630"/></circle>
    <circle r="3.5" fill="#FFD43B" opacity=".7"><animateMotion dur="4.2s" begin="1s" repeatCount="indefinite" path="M770 236H820"/></circle>

    <!-- legend -->
    <g class="mono" font-size="11.5" fill="#6B7A99">
      <line x1="40" y1="389" x2="64" y2="389" stroke="#61DAFB" stroke-width="2"/><text x="72" y="393">live data flow</text>
      <line x1="200" y1="389" x2="224" y2="389" stroke="#FFD43B" stroke-width="2" stroke-dasharray="5 3"/><text x="232" y="393">being wired up</text>
      <rect x="362" y="381" width="16" height="16" rx="3" fill="url(#haz)" stroke="#FFD43B" stroke-opacity=".5"/><text x="386" y="393">construction zone</text>
      <text x="960" y="393" text-anchor="end" fill="#3E4C68">frontend today · backend tomorrow · full-stack soon</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="429" rx="21.5" fill="none" stroke="url(#edge)"/>
</svg>
