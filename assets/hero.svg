<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Yousef Osama — Full-Stack Developer in the making</title>
  <desc id="desc">Animated banner: Yousef Osama, learning full-stack development with React and Django. Frontend compiled, backend compiling.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Inter",Ubuntu,"Helvetica Neue",Arial,sans-serif}
    .blob1{animation:drift1 14s ease-in-out infinite}
    .blob2{animation:drift2 18s ease-in-out infinite}
    .blob3{animation:drift3 16s ease-in-out infinite}
    @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,40px)}}
    @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-30px)}}
    @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}
    .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:2.4s}.d3{animation-delay:2.7s}.d4{animation-delay:3s}.d5{animation-delay:3.3s}.d6{animation-delay:3.6s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .twinkle{animation:tw 3.2s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
    .spin-rev{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .glow-dot{animation:gd 1.6s ease-in-out infinite}
    @keyframes gd{0%,100%{opacity:1}50%{opacity:.25}}
  </style>
  <defs>
    <radialGradient id="bc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#61DAFB" stop-opacity=".38"/><stop offset="1" stop-color="#61DAFB" stop-opacity="0"/></radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#44B78B" stop-opacity=".34"/><stop offset="1" stop-color="#44B78B" stop-opacity="0"/></radialGradient>
    <radialGradient id="by" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFD43B" stop-opacity=".16"/><stop offset="1" stop-color="#FFD43B" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#61DAFB"/><stop offset=".45" stop-color="#E9F7FF"/><stop offset="1" stop-color="#44B78B"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1040 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#61DAFB"/><stop offset=".55" stop-color="#FFD43B"/><stop offset="1" stop-color="#44B78B"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#61DAFB" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#44B78B" stop-opacity=".55"/></linearGradient>
    <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9FB4D9" stroke-opacity=".08"/></pattern>
    <radialGradient id="fade" cx="70%" cy="50%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="gm"><rect width="1000" height="380" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1000" height="380" rx="22"/></clipPath>
    <clipPath id="type"><rect x="56" y="44" width="0" height="30"><animate attributeName="width" values="0;560" dur="2s" begin=".5s" fill="freeze" calcMode="spline" keySplines=".4 0 .6 1"/></rect></clipPath>
    <clipPath id="barclip"><rect x="60" y="318" width="520" height="8" rx="4"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="380" fill="#070B14"/>
    <circle class="blob1" cx="180" cy="40" r="300" fill="url(#bc)"/>
    <circle class="blob2" cx="880" cy="360" r="320" fill="url(#bg)"/>
    <circle class="blob3" cx="560" cy="200" r="220" fill="url(#by)"/>
    <rect width="1000" height="380" fill="url(#grid)" mask="url(#gm)"/>

    <!-- stars -->
    <g fill="#CFE8FF">
      <circle class="twinkle" cx="620" cy="60" r="1.4"/>
      <circle class="twinkle" cx="700" cy="330" r="1.2" style="animation-delay:.8s"/>
      <circle class="twinkle" cx="955" cy="110" r="1.6" style="animation-delay:1.6s"/>
      <circle class="twinkle" cx="590" cy="290" r="1" style="animation-delay:2.2s"/>
      <circle class="twinkle" cx="660" cy="150" r="1.1" style="animation-delay:1.1s"/>
      <circle class="twinkle" cx="930" cy="300" r="1.3" style="animation-delay:.4s"/>
      <circle class="twinkle" cx="480" cy="40" r="1" style="animation-delay:2.6s"/>
    </g>

    <!-- orbital system: React core, electrons in React / Python / Django colours -->
    <g transform="translate(805 196)">
      <circle r="150" fill="none" stroke="#9FB4D9" stroke-opacity=".12" stroke-dasharray="2 8" class="spin-rev"/>
      <circle r="128" fill="none" stroke="#61DAFB" stroke-opacity=".08"/>
      <g class="spin">
        <g>
          <ellipse rx="112" ry="40" fill="none" stroke="#61DAFB" stroke-opacity=".75" stroke-width="2"/>
          <circle r="5.5" fill="#61DAFB"><animateMotion dur="3.4s" repeatCount="indefinite" path="M-112 0A112 40 0 1 0 112 0A112 40 0 1 0-112 0"/></circle>
        </g>
        <g transform="rotate(60)">
          <ellipse rx="112" ry="40" fill="none" stroke="#61DAFB" stroke-opacity=".75" stroke-width="2"/>
          <circle r="5.5" fill="#FFD43B"><animateMotion dur="4.2s" repeatCount="indefinite" path="M112 0A112 40 0 1 0-112 0A112 40 0 1 0 112 0"/></circle>
        </g>
        <g transform="rotate(120)">
          <ellipse rx="112" ry="40" fill="none" stroke="#61DAFB" stroke-opacity=".75" stroke-width="2"/>
          <circle r="5.5" fill="#44B78B"><animateMotion dur="5s" repeatCount="indefinite" path="M-112 0A112 40 0 1 1 112 0A112 40 0 1 1-112 0"/></circle>
        </g>
      </g>
      <circle r="20" fill="#61DAFB" opacity=".35" filter="url(#soft)" class="pulse"/>
      <circle r="12" fill="#61DAFB"/>
      <circle r="5" fill="#E9F7FF"/>
    </g>

    <!-- status pill -->
    <g class="rise d6"><g transform="translate(728 28)">
      <rect width="246" height="30" rx="15" fill="#0E1626" stroke="#44B78B" stroke-opacity=".5"/>
      <circle class="glow-dot" cx="20" cy="15" r="4.5" fill="#44B78B"/>
      <text x="34" y="20" class="mono" font-size="12.5" fill="#B7F0D4">learning in public · 2026</text>
    </g></g>

    <!-- terminal prompt (typed) -->
    <g clip-path="url(#type)">
      <text x="60" y="66" class="mono" font-size="15" fill="#6B7A99"><tspan fill="#44B78B">❯</tspan> <tspan fill="#8FA3C7">yousef</tspan> build <tspan fill="#61DAFB">--target</tspan> fullstack <tspan fill="#FFD43B">--stack</tspan> react,django</text>
    </g>
    <rect x="60" y="52" width="9" height="18" fill="#61DAFB" class="blink">
      <animate attributeName="x" values="60;616" dur="2s" begin=".5s" fill="freeze" calcMode="spline" keySplines=".4 0 .6 1"/>
    </rect>

    <!-- name -->
    <g class="rise d2">
      <text x="56" y="160" class="sans" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Yousef Osama</text>
    </g>
    <g class="rise d3">
      <text x="60" y="203" class="sans" font-size="22" fill="#C9D4E5" font-weight="500">Full-Stack Developer <tspan fill="#6B7A99">—</tspan> <tspan fill="#ffffff" font-style="italic">in the making</tspan></text>
    </g>

    <!-- stack chips -->
    <g class="rise d4 mono" font-size="13.5">
      <g transform="translate(60 228)">
        <rect width="104" height="32" rx="9" fill="#61DAFB" fill-opacity=".1" stroke="#61DAFB" stroke-opacity=".55"/>
        <circle cx="18" cy="16" r="4" fill="#61DAFB"/><text x="30" y="21" fill="#BDEFFF">React</text>
      </g>
      <g transform="translate(176 228)">
        <rect width="112" height="32" rx="9" fill="#FFD43B" fill-opacity=".08" stroke="#FFD43B" stroke-opacity=".5"/>
        <circle cx="18" cy="16" r="4" fill="#FFD43B"/><text x="30" y="21" fill="#FFF1B8">Python</text>
      </g>
      <g transform="translate(300 228)">
        <rect width="112" height="32" rx="9" fill="#44B78B" fill-opacity=".1" stroke="#44B78B" stroke-opacity=".55"/>
        <circle cx="18" cy="16" r="4" fill="#44B78B"/><text x="30" y="21" fill="#BFF2DA">Django</text>
      </g>
    </g>

    <!-- build progress -->
    <g class="rise d5">
      <text x="60" y="305" class="mono" font-size="12.5" fill="#6B7A99">compiling <tspan fill="#C9D4E5">full_stack_developer</tspan></text>
      <text x="580" y="305" class="mono" font-size="12.5" fill="#6B7A99" text-anchor="end"><tspan fill="#44B78B">frontend ✓</tspan>  ·  <tspan fill="#FFD43B">backend ⟳</tspan></text>
      <rect x="60" y="318" width="520" height="8" rx="4" fill="#141C2E"/>
      <g clip-path="url(#barclip)">
        <rect x="60" y="318" width="0" height="8" rx="4" fill="url(#bar)">
          <animate attributeName="width" values="0;338" dur="2.2s" begin="3.6s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1"/>
        </rect>
        <rect x="-60" y="318" width="60" height="8" fill="url(#sheen)" opacity=".7">
          <animate attributeName="x" values="-60;398" dur="2.4s" begin="6s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="60" y="350" class="mono" font-size="11.5" fill="#4F5D7A">65% · step 2 of 3 · next: Django REST Framework</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="379" rx="21.5" fill="none" stroke="url(#edge)"/>
</svg>
